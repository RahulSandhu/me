# Serves the Jekyll build under its baseurl, /me. Caddy proxies /me/* here
# WITHOUT stripping the prefix, so the subpath is kept end to end.
server {
    listen      80;
    server_name _;

    # Relative Location headers, so nginx's directory redirects (e.g. for
    # /me/blog/post -> /me/blog/post/) keep the /me prefix.
    absolute_redirect off;

    root  /usr/share/nginx/html;
    index index.html;

    location = /me {
        return 301 /me/;
    }

    location /me/ {
        alias /usr/share/nginx/html/;
    }

    # Nothing outside /me is served by this container.
    location / {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        root     /usr/share/nginx/html;
        internal;
    }
}
