<article class="post-card">
  <h2><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h2>
  <p class="post-meta">{{ include.post.date | date: "%B %-d, %Y" }}
    {%- if include.post.tags %}{% for t in include.post.tags %}<span class="tag">{{ t }}</span>{% endfor %}{% endif %}</p>
  {%- if include.post.description %}<p>{{ include.post.description }}</p>{% endif %}
</article>
