<div class="skill-group">
  <h3 class="sidebar-heading">{{ include.heading }}</h3>
  {%- for item in include.items %}
  <div class="skill">
    <span class="skill-name">{{ item.name }}</span>
    <span class="skill-bars">
      {%- for i in (1..3) %}<span class="bar{% if i <= item.level %} filled{% endif %}"></span>{% endfor -%}
    </span>
  </div>
  {%- endfor %}
</div>
