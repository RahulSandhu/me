# Serves the Jekyll build at the domain ROOT — used by the public funnel node
# (me.tail91459b.ts.net). Built with an empty baseurl, so links are
# root-relative and every path maps straight onto /usr/share/nginx/html.
server {
    listen      80;
    server_name _;

    # Relative Location headers, so nginx's directory redirects
    # (e.g. /blog/post -> /blog/post/) stay on the same host.
    absolute_redirect off;

    root  /usr/share/nginx/html;
    index index.html;

    # Pretty permalinks live at directory + index.html; try the file, then the
    # directory, then 404.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
