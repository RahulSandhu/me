title: Ravneet-Rahul Sandhu Singh
description: Biomedical Engineer — personal website
author: Ravneet-Rahul Sandhu Singh
timezone: Europe/Madrid
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/
url: "https://docker-host.tail91459b.ts.net"
baseurl: ""

exclude: [Gemfile, Gemfile.lock, vendor, .bundle, README.md, nginx.conf, nginx.root.conf, compose.yaml, Dockerfile]

plugins: [jekyll-feed, jekyll-sitemap]

nav:
  - { name: blog,    link: /blog/ }
  - { name: resume,  link: /resume.pdf }

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
