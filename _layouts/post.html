---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}
    {%- if page.tags %}{% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}{% endif %}</p>
  <div class="post-content">{{ content }}</div>
  <p class="back-link"><a href="{{ '/blog/' | relative_url }}">&larr; Back to blog</a></p>
</article>
